<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>

    <script>
        function validateComments() {
            var comment = document.getElementById("comments").value;

            if (comment.length > 200) {
                alert("Max 200 characters allowed!");
                return false;
            }
            return true;
        }
    </script>

</head>
<body>

<h2>Feedback Form</h2>

<form action="FeedbackServlet" method="post" onsubmit="return validateComments()">

    Name:
    <input type="text" name="name" required><br><br>

    Email:
    <input type="email" name="email" required><br><br>

    Rating:
    <select name="rating" required>
        <option value="">Select</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
    </select><br><br>

    Comments:
    <textarea id="comments" name="comments" rows="4" cols="30" required></textarea><br><br>

    <input type="submit" value="Submit">

</form>

</body>
</html>
